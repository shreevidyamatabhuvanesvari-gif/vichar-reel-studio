<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b18">
<title>Vichar Reel Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.app{min-height:100vh;display:grid;place-items:center;padding:12px}
.panel{width:min(100%,980px);display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:16px}
.controls,.stagebox{background:#11162a;border:1px solid #29304a;border-radius:18px;padding:14px}
.controls{display:flex;flex-direction:column;gap:10px}
h1{font-size:1.2rem;margin:0 0 4px}
label{font-size:.82rem;color:#b8c0d8;display:grid;gap:5px}
input,textarea,select,button{font:inherit;border-radius:10px;border:1px solid #3a4565;background:#0a0e1d;color:#fff;padding:10px}
textarea{resize:vertical;min-height:100px}
button{cursor:pointer;background:#5b5cf0;border-color:#7475ff;font-weight:600}
button.alt{background:#202943;border-color:#3b496d}
button:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:100px}
.hint{font-size:.75rem;color:#8e99b8;line-height:1.4;margin:0}
.stagebox{display:grid;place-items:center}
.stage{position:relative;width:min(100%,360px);aspect-ratio:9/16;overflow:hidden;background:#171c32;border-radius:12px;isolation:isolate}
#photo{width:100%;height:100%;object-fit:cover;display:none}
.shade{position:absolute;inset:0;background:linear-gradient(180deg,#0002,#0005 55%,#0009);z-index:1}
.quote{position:absolute;z-index:2;inset:0;display:grid;place-items:center;padding:28px;text-align:center;white-space:pre-wrap;overflow:hidden}
#current{font-size:clamp(1.2rem,5vw,2rem);line-height:1.55;font-weight:400;max-width:100%;color:#fff;text-shadow:0 0 5px #fff,0 0 14px #ff39d6,0 0 25px #32d9ff,0 0 38px #ffe45b;animation:glow 3s linear infinite}
@keyframes glow{0%,100%{filter:hue-rotate(0)}50%{filter:hue-rotate(75deg)}}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:#8792b1;text-align:center;padding:20px;z-index:3}
.badge{font-size:.75rem;color:#aeb8d4}
.status{min-height:1.2em;color:#9fe7bd;font-size:.8rem}
.recording .quote{padding:22px}
.recording .shade{background:linear-gradient(180deg,#0001,#0004 55%,#0008)}
@media(max-width:700px){
.panel{grid-template-columns:1fr}
.stagebox{order:-1}
.stage{width:min(78vw,360px)}
}
</style>
</head>
<body>
<main class="app">
<section class="panel">
<section class="controls">
<h1>Vichar Reel Studio</h1>
<p class="hint">फोटो से 9:16 सुविचार रील बनाइए और मोबाइल स्क्रीन रिकॉर्डर से रिकॉर्ड कीजिए।</p>

<label>फोटो चुनें
<input id="image" type="file" accept="image/*">
</label>

<label>भाषा
<select id="lang">
<option value="hi-IN">हिंदी</option>
<option value="sa-IN">संस्कृत</option>
</select>
</label>

<label>सुविचार
<textarea id="text" placeholder="सुविचार यहाँ लिखें…">सत्यमेव जयते।
सत्य की ही विजय होती है।</textarea>
</label>

<div class="row">
<button id="play">▶ चलाएँ</button>
<button id="pause" class="alt">Ⅱ रोकें</button>
<button id="stop" class="alt">■ बंद</button>
</div>

<div class="row">
<button id="fullscreen" class="alt">⛶ पूर्ण स्क्रीन</button>
<button id="record" class="alt">● रिकॉर्डिंग मोड</button>
</div>

<p id="voice" class="badge">आवाज़ खोजी जा रही है…</p>
<p id="status" class="status"></p>
<p class="hint">रिकॉर्डिंग के लिए पहले “रिकॉर्डिंग मोड” दबाएँ, फिर मोबाइल का Screen Recorder शुरू करें।</p>
</section>

<section class="stagebox">
<div id="stage" class="stage">
<img id="photo" alt="चयनित फोटो">
<div class="shade"></div>
<div class="quote"><div id="current"></div></div>
<div id="empty" class="empty">फोटो चुनें और “चलाएँ” दबाएँ</div>
</div>
</section>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
